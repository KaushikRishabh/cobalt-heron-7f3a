name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - name: Docker build
        run: docker build -t wind-pilot .
      - name: Docker health and API smoke test
        run: |
          docker run -d --name wind-pilot -p 8000:8000 wind-pilot
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/api/dashboard
          curl --fail http://localhost:8000/
